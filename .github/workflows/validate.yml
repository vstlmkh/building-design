name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm pack --dry-run
      - name: Smoke-test the installer
        run: |
          scratch="$(mktemp -d)"
          trap 'rm -rf "$scratch"' EXIT
          node bin/building-design.js install --project "$scratch"
          node bin/building-design.js install --project "$scratch"
          node bin/building-design.js install --project "$scratch" --force
          node bin/building-design.js status --project "$scratch"
